<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprehensive User Information Form</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
  <div class="container mx-auto p-6 bg-white rounded-lg shadow-lg max-w-4xl">
    <h1 class="text-3xl font-bold text-center mb-6">User Information Form</h1>
    <form class="space-y-8">
      <!-- Personal Information -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Personal Information</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
            <input type="text" id="firstName" name="firstName" class="mt-1 block w-full p-2 border rounded-md" required>
          </div>
          <div>
            <label for="middleName" class="block text-sm font-medium text-gray-700">Middle Initial</label>
            <input type="text" id="middleName" name="middleName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
            <input type="text" id="lastName" name="lastName" class="mt-1 block w-full p-2 border rounded-md" required>
          </div>
          <div>
            <label for="fullName" class="block text-sm font-medium text-gray-700">Full Legal Name</label>
            <input type="text" id="fullName" name="fullName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="preferredName" class="block text-sm font-medium text-gray-700">Preferred First Name</label>
            <input type="text" id="preferredName" name="preferredName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="familyName" class="block text-sm font-medium text-gray-700">Family Name</label>
            <input type="text" id="familyName" name="familyName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="prefix" class="block text-sm font-medium text-gray-700">Title (Mr/Ms/Dr)</label>
            <select id="prefix" name="prefix" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Mr">Mr</option>
              <option value="Ms">Ms</option>
              <option value="Dr">Dr</option>
            </select>
          </div>
          <div>
            <label for="gender" class="block text-sm font-medium text-gray-700">Gender</label>
            <select id="gender" name="gender" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="dateOfBirth" class="block text-sm font-medium text-gray-700">Date of Birth</label>
            <input type="date" id="dateOfBirth" name="dateOfBirth" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="nationality" class="block text-sm font-medium text-gray-700">Nationality</label>
            <input type="text" id="nationality" name="nationality" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="maritalStatus" class="block text-sm font-medium text-gray-700">Marital Status</label>
            <select id="maritalStatus" name="maritalStatus" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Divorced">Divorced</option>
              <option value="Widowed">Widowed</option>
            </select>
          </div>
          <div>
            <label for="servedInMilitary" class="block text-sm font-medium text-gray-700">Served in Military?</label>
            <select id="servedInMilitary" name="servedInMilitary" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- Contact Details -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Contact Details</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="emailAddress" class="block text-sm font-medium text-gray-700">Email Address</label>
            <input type="email" id="emailAddress" name="emailAddress" class="mt-1 block w-full p-2 border rounded-md" required>
          </div>
          <div>
            <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Phone Number</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="phoneAlternativeNumber" class="block text-sm font-medium text-gray-700">Alternate Phone Number</label>
            <input type="tel" id="phoneAlternativeNumber" name="phoneAlternativeNumber" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="phoneDeviceType" class="block text-sm font-medium text-gray-700">Phone Device Type</label>
            <input type="text" id="phoneDeviceType" name="phoneDeviceType" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="twitterUrl" class="block text-sm font-medium text-gray-700">Twitter Profile URL</label>
            <input type="url" id="twitterUrl" name="twitterUrl" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="linkedinUrl" class="block text-sm font-medium text-gray-700">LinkedIn Profile URL</label>
            <input type="url" id="linkedinUrl" name="linkedinUrl" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="githubUrl" class="block text-sm font-medium text-gray-700">GitHub Profile URL</label>
            <input type="url" id="githubUrl" name="githubUrl" class="mt-1 block w-full p-2 border rounded-md">
          </div>
        </div>
      </fieldset>

      <!-- Address -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Address</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="address1" class="block text-sm font-medium text-gray-700">Street Address</label>
            <input type="text" id="address1" name="address1" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="apartment" class="block text-sm font-medium text-gray-700">Apartment Number</label>
            <input type="text" id="apartment" name="apartment" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="building" class="block text-sm font-medium text-gray-700">Building Name</label>
            <input type="text" id="building" name="building" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="city" class="block text-sm font-medium text-gray-700">City</label>
            <input type="text" id="city" name="city" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="state" class="block text-sm font-medium text-gray-700">State/Province</label>
            <input type="text" id="state" name="state" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="zip" class="block text-sm font-medium text-gray-700">ZIP/Postal Code</label>
            <input type="text" id="zip" name="zip" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="country" class="block text-sm font-medium text-gray-700">Country</label>
            <input type="text" id="country" name="country" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="countryRegion" class="block text-sm font-medium text-gray-700">Country Region</label>
            <input type="text" id="countryRegion" name="countryRegion" class="mt-1 block w-full p-2 border rounded-md">
          </div>
        </div>
      </fieldset>

      <!-- Employment History -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Employment History</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="employmentStatus" class="block text-sm font-medium text-gray-700">Employment Status</label>
            <select id="employmentStatus" name="employmentStatus" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Employed">Employed</option>
              <option value="Unemployed">Unemployed</option>
              <option value="Self-Employed">Self-Employed</option>
            </select>
          </div>
          <div>
            <label for="company" class="block text-sm font-medium text-gray-700">Current Employer</label>
            <input type="text" id="company" name="company" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="jobTitle" class="block text-sm font-medium text-gray-700">Job Title</label>
            <input type="text" id="jobTitle" name="jobTitle" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="startDate" class="block text-sm font-medium text-gray-700">Start Date</label>
            <input type="date" id="startDate" name="startDate" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="endDate" class="block text-sm font-medium text-gray-700">End Date</label>
            <input type="date" id="endDate" name="endDate" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="stillWorking" class="block text-sm font-medium text-gray-700">Still Working?</label>
            <select id="stillWorking" name="stillWorking" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div>
            <label for="workedPreviously" class="block text-sm font-medium text-gray-700">Worked Previously?</label>
            <select id="workedPreviously" name="workedPreviously" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
          <div>
            <label for="grossSalary" class="block text-sm font-medium text-gray-700">Gross Annual Salary</label>
            <input type="number" id="grossSalary" name="grossSalary" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="expectedSalary" class="block text-sm font-medium text-gray-700">Expected Salary</label>
            <input type="number" id="expectedSalary" name="expectedSalary" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="noticePeriod" class="block text-sm font-medium text-gray-700">Notice Period</label>
            <input type="text" id="noticePeriod" name="noticePeriod" class="mt-1 block w-full p-2 border rounded-md">
          </div>
        </div>
      </fieldset>

      <!-- Education -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Education</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="educationLevel" class="block text-sm font-medium text-gray-700">Highest Education Level</label>
            <select id="educationLevel" name="educationLevel" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="High School">High School</option>
              <option value="Bachelor's">Bachelor's</option>
              <option value="Master's">Master's</option>
              <option value="Doctorate">Doctorate</option>
            </select>
          </div>
          <div>
            <label for="degree" class="block text-sm font-medium text-gray-700">Degree Title</label>
            <input type="text" id="degree" name="degree" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="fieldOfStudy" class="block text-sm font-medium text-gray-700">Field of Study</label>
            <input type="text" id="fieldOfStudy" name="fieldOfStudy" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="school" class="block text-sm font-medium text-gray-700">University Name</label>
            <input type="text" id="school" name="school" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="collegeName" class="block text-sm font-medium text-gray-700">College Name</label>
            <input type="text" id="collegeName" name="collegeName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="courseName" class="block text-sm font-medium text-gray-700">Course Name</label>
            <input type="text" id="courseName" name="courseName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="educationType" class="block text-sm font-medium text-gray-700">Education Type</label>
            <select id="educationType" name="educationType" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Online">Online</option>
            </select>
          </div>
          <div>
            <label for="grade" class="block text-sm font-medium text-gray-700">Grade</label>
            <input type="text" id="grade" name="grade" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="graduationDate" class="block text-sm font-medium text-gray-700">Graduation Date</label>
            <input type="date" id="graduationDate" name="graduationDate" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="stillStudying" class="block text-sm font-medium text-gray-700">Still Studying?</label>
            <select id="stillStudying" name="stillStudying" class="mt-1 block w-full p-2 border rounded-md">
              <option value="">Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </div>
        </div>
      </fieldset>

      <!-- Projects -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Projects</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="projectName" class="block text-sm font-medium text-gray-700">Project Name</label>
            <input type="text" id="projectName" name="projectName" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="gitUrl" class="block text-sm font-medium text-gray-700">Git Repository URL</label>
            <input type="url" id="gitUrl" name="gitUrl" class="mt-1 block w-full p-2 border rounded-md">
          </div>
          <div>
            <label for="hostUrl" class="block text-sm font-medium text-gray-700">Live Site URL</label>
            <input type="url" id="hostUrl" name="hostUrl" class="mt-1 block w-full p-2 border rounded-md">
          </div>
        </div>
      </fieldset>

      <!-- Account Details -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Account Details</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" id="password" name="password" class="mt-1 block w-full p-2 border rounded-md" required>
          </div>
          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="mt-1 block w-full p-2 border rounded-md" required>
          </div>
        </div>
      </fieldset>

      <!-- Additional Information -->
      <fieldset class="border p-6 rounded-lg">
        <legend class="text-xl font-semibold">Additional Information</legend>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="howDidYouHearAboutUs" class="block text-sm font-medium text-gray-700">Referral Source</label>
            <input type="text" id="howDidYouHearAboutUs" name="howDidYouHearAboutUs" class="mt-1 block w-full p-2 border rounded-md">
          </div>
        </div>
      </fieldset>

      <div class="text-center">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
